# Optional local integration services for Med Fabric.
# Ordinary Mix, Blitz, and Weld checks run completely offline without Docker.
#
# Usage:
#   docker compose -f ops/compose.yml up -d postgres hapi_fhir
#   docker compose -f ops/compose.yml --profile turn up -d coturn

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: med_fabric
      POSTGRES_PASSWORD: med_fabric_dev_password
      POSTGRES_DB: med_fabric_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U med_fabric -d med_fabric_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  hapi_fhir:
    image: hapiproject/hapi:v7.6.0
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_conditional_create: "true"
      hapi.fhir.client_id_strategy: ANY
    ports:
      - "8080:8080"

  coturn:
    image: coturn/coturn:4.6.3-alpine
    profiles: ["turn"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=medfabric.local"
      - "--lt-cred-mech"
      - "--user=med:med_turn_dev_secret"
      - "--no-tls"
      - "--no-dtls"
